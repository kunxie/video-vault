apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-vault
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/name: video-vault
    app.kubernetes.io/part-of: video-vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: web
      app.kubernetes.io/name: video-vault
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
        app.kubernetes.io/name: video-vault
        app.kubernetes.io/part-of: video-vault
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          # The platform replaces this symbolic slot with an immutable digest.
          image: platform-runtime-image # NOSONAR
          imagePullPolicy: Always
          args:
            - serve
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: video-vault-runtime
          env:
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: video-vault-db-credentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: video-vault-db-credentials
                  key: password
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: video-vault-db-credentials
                  key: host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: video-vault-db-credentials
                  key: port
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: video-vault-db-credentials
                  key: dbname
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: video-vault-minio-credentials
                  key: endpoint
            - name: MINIO_BUCKET
              valueFrom:
                secretKeyRef:
                  name: video-vault-minio-credentials
                  key: bucket
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: video-vault-minio-credentials
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: video-vault-minio-credentials
                  key: secret-key
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
