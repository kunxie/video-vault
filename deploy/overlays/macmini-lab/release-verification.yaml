apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: video-vault-release-verification-egress
  labels:
    app.kubernetes.io/component: release-verification
    app.kubernetes.io/name: video-vault
    app.kubernetes.io/part-of: video-vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: release-verification
      app.kubernetes.io/name: video-vault
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              v1.min.io/tenant: minio
      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: video-vault-release-verification
  labels:
    app.kubernetes.io/component: release-verification
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: video-vault
    app.kubernetes.io/part-of: video-vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 1
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: release-verification
        app.kubernetes.io/name: video-vault
        app.kubernetes.io/part-of: video-vault
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: release-verification
          # The platform replaces this symbolic slot with an immutable digest.
          image: platform-runtime-image # NOSONAR
          imagePullPolicy: Always
          args:
            - verify-services
          env:
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: video-vault-db-credentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: video-vault-db-credentials
                  key: password
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: video-vault-db-credentials
                  key: host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: video-vault-db-credentials
                  key: port
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: video-vault-db-credentials
                  key: dbname
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: video-vault-minio-credentials
                  key: endpoint
            - name: MINIO_BUCKET
              valueFrom:
                secretKeyRef:
                  name: video-vault-minio-credentials
                  key: bucket
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: video-vault-minio-credentials
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: video-vault-minio-credentials
                  key: secret-key
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
