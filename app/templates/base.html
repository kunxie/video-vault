<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Video Vault{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      h1 { margin-bottom: 1rem; }
      table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
      th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #8884; }
      td.actions a, td.actions button {
        margin-right: 0.5rem;
        cursor: pointer;
      }
      .upload-form {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        padding: 1rem;
        border: 1px solid #8884;
        border-radius: 8px;
      }
      .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
      .htmx-request .htmx-indicator { opacity: 1; }
      .empty { color: #8888; font-style: italic; }
      a.back { display: inline-block; margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    {% block content %}{% endblock %}
  </body>
</html>
